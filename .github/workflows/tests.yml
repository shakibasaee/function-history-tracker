name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tracker-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B -m unittest discover -s tests -v
